<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spark { stroke-dasharray: 9 91; stroke-dashoffset: 9; opacity: 0; animation: spark 2.4s cubic-bezier(0.45,0,0.2,1) infinite; }
    @keyframes spark { 0% { stroke-dashoffset: 9; opacity: 0; } 8% { opacity: 1; } 62% { stroke-dashoffset: -91; opacity: 1; } 66%,100% { stroke-dashoffset: -91; opacity: 0; } }
    .dot { transform-box: fill-box; transform-origin: center; animation: dot 2.4s ease-out infinite; }
    @keyframes dot { 0%,58% { transform: scale(1); } 66% { transform: scale(1.5); } 80%,100% { transform: scale(1); } }
    .ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    @keyframes ring { 0%,60% { transform: scale(0.6); opacity: 0; } 64% { opacity: 0.9; } 100% { transform: scale(2.1); opacity: 0; } }
    .halo { animation: halo 2.4s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: 0.7; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="pl-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d2650"/>
      <stop offset="1" stop-color="#110e24"/>
    </linearGradient>
    <radialGradient id="pl-halo" cx="24" cy="28" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pl-bag" x1="10" y1="12" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="pl-beat" x1="5" y1="0" x2="41" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <mask id="pl-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <path d="M5 29 H14 L17.5 23 L21.5 35 L26 19.5 L29.5 29 H38.5" stroke="#000" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <filter id="pl-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#pl-tile)"/>
  <rect class="halo" width="48" height="48" rx="13" fill="url(#pl-halo)"/>
  <g mask="url(#pl-cut)">
    <path d="M18.5 16.5 V13.5 a5.5 5.5 0 0 1 11 0 V16.5" stroke="url(#pl-bag)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14.2 16.5 H33.8 L38.4 36.6 Q39 39.5 36.2 39.5 H11.8 Q9 39.5 9.6 36.6 Z" fill="url(#pl-bag)" stroke="url(#pl-bag)" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <path d="M5 29 H14 L17.5 23 L21.5 35 L26 19.5 L29.5 29 H38.5" stroke="url(#pl-beat)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" filter="url(#pl-glow)"/>
  <path class="spark" d="M5 29 H14 L17.5 23 L21.5 35 L26 19.5 L29.5 29 H38.5" pathLength="100" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pl-glow)"/>
  <circle class="ring" cx="41" cy="29" r="3.2" stroke="#67e8f9" stroke-width="0.9"/>
  <circle class="dot" cx="41" cy="29" r="2" fill="#67e8f9" filter="url(#pl-glow)"/>
  <rect x="0.6" y="0.6" width="46.8" height="46.8" rx="12.4" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
</svg>
