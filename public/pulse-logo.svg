<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl-tile-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6442ef"/>
      <stop offset="100%" stop-color="#4f26d9"/>
    </linearGradient>
    <filter id="pl-line-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded Purple Squircle Tile -->
  <rect width="48" height="48" rx="12" fill="url(#pl-tile-grad)"/>
  <!-- Subtle border highlight -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
  <!-- Crisp White Pulse Waveform -->
  <path
    d="M7 24 H15 L18.5 17 L22.5 32 L27.5 13 L31.5 24 H41"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#pl-line-glow)"
  />
</svg>
